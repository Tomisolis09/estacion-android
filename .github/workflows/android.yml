name: Compilar app Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Permisos de ubicación e íconos
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' "$MANIFEST"
          npx capacitor-assets generate --android

      - name: Número de versión
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle

      - name: Sincronizar la web
        run: npx cap sync android

      - name: Compilar APK de prueba
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Compilar AAB para Play Store
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Firmar el AAB (solo si cargaste tu clave)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Sin clave cargada: se omite la firma."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > clave.jks
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore clave.jks -storepass "$KEYSTORE_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          rm clave.jks

      - uses: actions/upload-artifact@v4
        with:
          name: apk-de-prueba
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aab-para-play-store
          path: android/app/build/outputs/bundle/release/app-release.aab
