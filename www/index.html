<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Estación Meteorológica</title>
<style>
:root {
  --bg: #eef2f7; --card: #ffffff; --line: #e2e8f0; --text: #0f172a; --text2: #64748b;
  --accent: #2563eb; --sub: #f1f5f9; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
  --n1: #ca8a04; --n1bg: #fef9c3; --n2: #ea580c; --n2bg: #ffedd5; --n3: #dc2626; --n3bg: #fee2e2;
  --tab: #ffffffee; --shadow: 0 1px 2px rgba(15,23,42,.06); color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --bg: #0b1220; --card: #131c2e; --line: #223049; --text: #e5e9f0; --text2: #8b9bb4;
    --accent: #5b9bff; --sub: #182339; --tab: #0f1729ee; --shadow: none; color-scheme: dark;
    --n1: #facc15; --n1bg: #3a3210; --n2: #fb923c; --n2bg: #3d2410; --n3: #f87171; --n3bg: #3f1616;
  }
}
:root[data-tema="oscuro"] {
  --bg: #0b1220; --card: #131c2e; --line: #223049; --text: #e5e9f0; --text2: #8b9bb4;
  --accent: #5b9bff; --sub: #182339; --tab: #0f1729ee; --shadow: none; color-scheme: dark;
  --n1: #facc15; --n1bg: #3a3210; --n2: #fb923c; --n2bg: #3d2410; --n3: #f87171; --n3bg: #3f1616;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overscroll-behavior-y: contain; }
button { font: inherit; color: inherit; cursor: pointer; }
#app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; }
header { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 10px) 16px 8px; }
#btnUbic { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; background: none; border: 0; padding: 4px 0; text-align: left; }
#btnUbic small { color: var(--text2); font-size: 12px; }
#btnUbic strong { font-size: 17px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; box-shadow: var(--shadow); position: relative; }
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn.girando svg { animation: gira .9s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
main { flex: 1; overflow-y: auto; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 12px; }
nav { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--tab); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 6px 2px calc(env(safe-area-inset-bottom) + 6px); }
nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 10px; letter-spacing: -.1px; color: var(--text2); border-radius: 12px; position: relative; min-width: 0; white-space: nowrap; }
nav button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button[aria-selected="true"] { color: var(--accent); font-weight: 600; }
.punto { position: absolute; top: 4px; right: 22%; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); border: 2px solid var(--card); }
.punto.n1 { background: var(--n1); } .punto.n2 { background: var(--n2); } .punto.n3 { background: var(--n3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.hero { border-radius: 24px; padding: 20px; color: #fff; display: flex; flex-direction: column; gap: 6px; }
.hero .fila { display: flex; align-items: center; gap: 12px; }
.hero .ico { font-size: 56px; line-height: 1; } .hero .temp { font-size: 68px; font-weight: 700; line-height: 1; letter-spacing: -2px; }
.hero .desc { font-size: 18px; font-weight: 600; } .hero .meta { opacity: .88; font-size: 14px; }
.rota { margin-top: 8px; background: rgba(255,255,255,.16); border-radius: 12px; padding: 8px 12px; font-size: 13px; min-height: 36px; display: flex; align-items: center; transition: opacity .3s; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
.card h2 { margin: 0 0 10px; font-size: 14px; font-weight: 700; } .card h2 span { color: var(--text2); font-weight: 500; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dato { background: var(--sub); border-radius: 12px; padding: 10px 6px; text-align: center; min-width: 0; }
.dato small { display: block; color: var(--text2); font-size: 11px; } .dato b { font-size: 17px; font-variant-numeric: tabular-nums; }
.tira { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.tira::-webkit-scrollbar { display: none; }
.h { flex: 0 0 auto; min-width: 58px; background: var(--sub); border-radius: 14px; padding: 8px 6px; text-align: center; display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums; }
.h small { color: var(--text2); font-size: 11px; } .h .e { font-size: 22px; } .h b { font-size: 15px; }
.seg { display: flex; background: var(--sub); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px 4px; border-radius: 10px; font-size: 13px; color: var(--text2); min-width: 0; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.filah { display: grid; grid-template-columns: 48px 28px 1fr 64px; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.filah:last-child { border: 0; } .filah .hh { color: var(--text2); font-size: 13px; } .filah .e { font-size: 20px; text-align: center; } .filah .val { text-align: right; font-weight: 600; font-size: 14px; }
.barra { height: 8px; background: var(--sub); border-radius: 4px; overflow: hidden; } .barra i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.barra.viento i { background: #14b8a6; } .barra.uv i { background: #f59e0b; } .barra.lluvia i { background: #3b82f6; }
.dia { flex: 0 0 auto; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); }
.dia .cab { display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center; }
.dia .e { font-size: 30px; } .dia .nom { font-weight: 700; } .dia .sub { color: var(--text2); font-size: 12px; }
.dia .mm { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; } .dia .mm small { color: var(--text2); font-weight: 500; }
.dia .det { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.mini-bars { display: flex; align-items: flex-end; gap: 6px; height: 90px; }
.mini-bars div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; }
.mini-bars i { width: 100%; background: #3b82f6; border-radius: 5px 5px 2px 2px; min-height: 3px; } .mini-bars small { color: var(--text2); font-size: 10px; }
.lineas { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.titulo-g { font-size: 17px; font-weight: 700; margin: 0; }
.capa { display: grid; grid-template-columns: 56px 1fr 40px; gap: 8px; align-items: center; font-size: 13px; color: var(--text2); } .capa span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
.aviso { display: flex; gap: 10px; padding: 12px; border-radius: 14px; background: var(--sub); border-left: 4px solid var(--text2); }
.aviso.ok { border-color: var(--ok); } .aviso.info { border-color: var(--accent); } .aviso.warn { border-color: var(--warn); } .aviso.bad { border-color: var(--bad); }
.mov { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); } .mov:last-child { border: 0; }
.mov .e { font-size: 26px; } .mov b { display: block; } .mov .ok b { color: var(--ok); } .mov .warn b { color: var(--warn); } .mov .bad b { color: var(--bad); }
.estado { text-align: center; color: var(--text2); padding: 40px 12px; } .estado .grande { font-size: 56px; }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; background: var(--accent); color: #fff; font-weight: 600; }
.btn.sec { background: var(--sub); color: var(--text); } .btn.chico { padding: 8px 12px; font-size: 13px; }
.pie { text-align: center; color: var(--text2); font-size: 12px; margin: 0; }
.sutil { color: var(--text2); font-size: 13px; }

/* hojas (ubicación, ajustes, configuración inicial) */
.hoja { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; background: rgba(0,0,0,.45); }
.hoja[hidden] { display: none; }
.hoja-in { width: 100%; max-width: 560px; margin: 0 auto; background: var(--bg); border-radius: 24px 24px 0 0; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); max-height: 92%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.hoja-in input[type=search], .hoja-in input[type=text] { width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 12px; padding: 12px; font: inherit; font-size: 16px; }
#resultados { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; min-height: 40px; }
#resultados button { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; } #resultados small { color: var(--text2); display: block; }
@media (prefers-reduced-motion: reduce) { .rota { transition: none; } .icon-btn.girando svg { animation: none; } }

/* actividades */.pl-fila { display: flex; gap: 12px; align-items: center; }
.pl-bola { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; box-shadow: inset -6px -5px 10px #0005; }
.pl-fila b { font-size: 16px; } .pl-estado { font-size: 14px; margin-top: 2px; }
.pl-si { color: #16a34a; font-weight: 600; } .pl-no { color: var(--text2); }
.pl-tira { display: flex; gap: 3px; margin-top: 10px; }
.pl-tira button { flex: 1 1 0; min-width: 0; border: 0; border-radius: 6px; padding: 5px 0 4px; background: var(--sub); color: var(--text2); font-size: 9.5px; line-height: 1.2; text-align: center; }
.pl-tira button i { display: block; width: 8px; height: 8px; border-radius: 50%; margin: 3px auto 0; background: transparent; border: 1.5px solid var(--line); }
.pl-tira button.v i { background: #16a34a; border-color: #16a34a; }
.pl-tira button.n i { background: #f59e0b; border-color: #f59e0b; }
.pl-leyenda i.n { background: #f59e0b; }
.cielo { border-radius: 10px; padding: 7px 10px; font-size: 13px; margin-top: 8px; line-height: 1.35; } .cielo.sin { background: var(--sub); color: var(--text2); }
.pl-tira button[aria-pressed="true"] { outline: 2px solid var(--accent); color: var(--text); font-weight: 700; }
.pl-leyenda { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); margin: 2px 0 0; }
.pl-leyenda i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }
.chips { flex: 0 0 auto; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.paraguas { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--sub); border-left: 4px solid var(--accent); font-size: 22px; }
.paraguas div { font-size: 15px; display: flex; flex-direction: column; } .paraguas small { color: var(--text2); font-size: 12.5px; }
.guia-txt p { margin: 8px 0; font-size: 15px; line-height: 1.45; }
.guia-pts { display: flex; gap: 6px; justify-content: center; margin: 6px 0; } .guia-pts i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); } .guia-pts i.on { background: var(--accent); width: 18px; border-radius: 4px; }
.btn:disabled { opacity: .4; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; font-size: 13px; color: var(--text2); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.act { flex: 0 0 auto; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); display: block; }
.act .cab { display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center; }
.act .e { font-size: 28px; } .act .nom { font-weight: 700; } .act .sub { color: var(--text2); font-size: 12px; }
.veredicto { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.v-ideal { background: #dcfce7; color: #166534; } .v-bueno { background: #e0f2fe; color: #075985; }
.v-regular { background: var(--n1bg); color: var(--n1); } .v-malo { background: var(--n3bg); color: var(--n3); }
@media (prefers-color-scheme: dark) { :root:not([data-tema="claro"]) .v-ideal { background: #123524; color: #86efac; } :root:not([data-tema="claro"]) .v-bueno { background: #0c2a3d; color: #7dd3fc; } }
:root[data-tema="oscuro"] .v-ideal { background: #123524; color: #86efac; } :root[data-tema="oscuro"] .v-bueno { background: #0c2a3d; color: #7dd3fc; }
.puntaje { height: 6px; background: var(--sub); border-radius: 3px; overflow: hidden; margin-top: 10px; } .puntaje i { display: block; height: 100%; border-radius: 3px; }
.act-bt { display: block; width: 100%; background: none; border: 0; padding: 0; margin: 0; text-align: left; color: inherit; font: inherit; cursor: pointer; }
.hh-fila { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; } .hh-fila::-webkit-scrollbar { display: none; }
.hh { flex: 0 0 auto; min-width: 52px; background: var(--sub); border-radius: 12px; padding: 6px 4px; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; gap: 1px; }
.hh b { font-size: 14px; } .hh .e { font-size: 16px; } .hh small { color: var(--text2); }
.agenda { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.ag-fila { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: center; width: 100%; text-align: left; background: var(--sub); border: 0; border-radius: 12px; padding: 8px 10px; color: inherit; font: inherit; font-size: 14px; }
.ag-dia { font-weight: 700; font-size: 13px; } .ag-txt small { display: block; color: var(--text2); font-size: 12px; }
.act .det { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.act .det ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.act .ventana { display: inline-block; background: var(--sub); border-radius: 10px; padding: 6px 10px; font-weight: 600; }
main > * { flex-shrink: 0; }
.alerta-dia { display: flex; gap: 10px; padding: 12px; border-radius: 14px; border-left: 5px solid; font-size: 14px; }
.alerta-dia.n1 { background: var(--n1bg); border-color: var(--n1); } .alerta-dia.n2 { background: var(--n2bg); border-color: var(--n2); } .alerta-dia.n3 { background: var(--n3bg); border-color: var(--n3); }

/* avisos */
.nivel { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.nivel.n1 { background: var(--n1bg); color: var(--n1); } .nivel.n2 { background: var(--n2bg); color: var(--n2); } .nivel.n3 { background: var(--n3bg); color: var(--n3); }
.av { flex: 0 0 auto; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--text2); border-radius: 14px; padding: 12px; display: block; }
.av.n1 { border-left-color: var(--n1); } .av.n2 { border-left-color: var(--n2); } .av.n3 { border-left-color: var(--n3); }
.av .cab { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: start; } .av .e { font-size: 24px; }
.av .tit { font-weight: 700; } .av .sub { color: var(--text2); font-size: 12px; }
.av .det { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.av .det ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; } .av .det h4 { margin: 4px 0 0; font-size: 13px; }
.av .oficial { white-space: pre-line; }
.sec-tit { margin: 6px 2px 0; font-size: 13px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .04em; }
.banner { flex: 0 0 auto; width: 100%; text-align: left; display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 16px; border: 0; border-left: 5px solid; font-size: 14px; }
.banner.n1 { background: var(--n1bg); border-color: var(--n1); } .banner.n2 { background: var(--n2bg); border-color: var(--n2); } .banner.n3 { background: var(--n3bg); border-color: var(--n3); }
.banner .e { font-size: 24px; }
.nota { font-size: 12px; color: var(--text2); line-height: 1.45; }
.nota a, .nota .enlace { color: var(--accent); text-decoration: underline; cursor: pointer; }

/* ajustes */
.fila-aj { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.fila-aj:last-child { border: 0; } .fila-aj .tx { min-width: 0; } .fila-aj .tx small { display: block; color: var(--text2); font-size: 12px; }
.fila-aj input[type=time], .fila-aj select { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 8px; font: inherit; font-size: 15px; }
.fila-aj select { max-width: 48%; text-overflow: ellipsis; }
.hoja-in .btn.sec { border: 1px solid var(--line); }
.sw { position: relative; width: 48px; height: 28px; flex: 0 0 auto; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; width: 100%; height: 100%; cursor: pointer; z-index: 1; }
.sw i { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; }
.sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.sw input:checked + i { background: var(--accent); } .sw input:checked + i::after { transform: translateX(20px); }
.sw input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
.hoja-in h3 { margin: 4px 0 0; font-size: 20px; } .hoja-in .sec-tit { margin-top: 10px; }
.bloque { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 14px; }
.hoja-in .btn { width: 100%; }
@media (prefers-reduced-motion: reduce) { .sw i, .sw i::after { transition: none; } }
#hoja { z-index: 11; }
.sel-act { display: flex; flex-wrap: wrap; gap: 8px; }
.sel-act .chip { padding: 8px 12px; font-size: 14px; }
.act-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.act-cab .btn { white-space: nowrap; width: auto; }
.astro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.astro-grid .ai { background: var(--sub); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.astro-grid .ai small { color: var(--text2); font-size: 12px; } .astro-grid .ai b { font-size: 20px; }
.luna-fase { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.luna-fase .e { font-size: 40px; line-height: 1; }
.fases-prox { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; text-align: center; font-size: 12px; }
.fases-prox .e { font-size: 24px; display: block; }
.hoja-in select { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 12px; padding: 12px; font: inherit; font-size: 15px; }
.hoja-in .fila-aj select { padding: 8px; font-size: 15px; }
/*__ESTILOS_EXTRA__*/
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="btnUbic" aria-label="Cambiar ubicación"><small id="subUbic">Ubicación</small><strong id="nomUbic">Elegí una ciudad</strong></button>

  <main id="vista"></main>
  <nav id="tabs" role="tablist">
    <button role="tab" data-tab="hoy"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Hoy</button>
    <button role="tab" data-tab="horas"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Horas</button>
    <button role="tab" data-tab="dias"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Días</button>
    <button role="tab" data-tab="radar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 12l6-6"/></svg>Radar</button>
    <button role="tab" data-tab="activ"><svg viewBox="0 0 24 24"><path d="M12 3l4 8 6 1-4.5 4.5L19 23l-7-4-7 4 1.5-6.5L2 12l6-1z"/></svg>Actividad</button>
    <button role="tab" data-tab="avisos"><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg>Avisos<span class="punto" id="puntoAviso" hidden></span></button>
    <button role="tab" data-tab="planetas"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M2.5 15.5C1 12 6 7.5 14 5.5M21.5 8.5C23 12 18 16.5 10 18.5"/></svg>Planetas</button>
  </nav>

    <button class="btn sec" id="btnGPS">📍 Usar mi ubicación (GPS)</button>
    <div id="resultados"></div>
    <button class="btn sec" id="btnCerrarHoja">Cerrar</button>
  </div>
</div>
